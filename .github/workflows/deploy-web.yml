name: Circuits & Systems Classroom

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
      - ".github/configure-pages-domain.py"
      - ".github/doc-postprocess.py"
      - ".github/toolbox-drift.py"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
      - ".github/configure-pages-domain.py"
      - ".github/doc-postprocess.py"
      - ".github/toolbox-drift.py"
  # ADCToolbox does not trigger this workflow, so pick up its main once a day: its manual gets rebuilt from there, and
  # the functions the pages port are rerun against it
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    needs: toolbox-drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Type-check and test
        run: pnpm check

      - run: pnpm build

      # The reference manual keeps living in the ADCToolbox repository and its own Sphinx build; it is published here
      # under /doc/ so the toolbox has one front door, with the illustrations at the root.
      - name: Check out ADCToolbox for the reference manual
        uses: actions/checkout@v7
        with:
          repository: Arcadia-1/ADCToolbox
          path: toolbox

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: toolbox/python/pyproject.toml

      - name: Build the reference manual
        working-directory: .
        run: |
          pip install --upgrade pip
          pip install -e './toolbox/python[docs]'
          python -m sphinx -b html toolbox/python/docs/source web/dist/doc
          python -m sphinx -b html -D language=zh_CN toolbox/python/docs/source web/dist/doc/zh_CN
          touch web/dist/doc/.nojekyll

      # The manual used to be the whole of this domain, so every link into it still has to land.
      - name: Fold the manual into the site
        working-directory: .
        run: python3 .github/doc-postprocess.py web/dist

      - name: Build hostname migration middleware
        run: |
          pnpm exec wrangler pages functions build functions --outdir .wrangler/pages-functions --project-directory . --build-output-directory dist
          cp .wrangler/pages-functions/index.js dist/_worker.js

      - name: Attach the public tutorial domain
        if: github.ref == 'refs/heads/main'
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 .github/configure-pages-domain.py

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy dist --project-name ams-class --branch main --commit-message "GitHub Actions ${GITHUB_SHA}"

  # The pages' tests pin the numbers ADCToolbox printed when each page was written, so they cannot notice the library
  # changing a ported function. Rerun all references, including PLL, against its main as it is now.
  # Publishing depends on this job so a numerical mismatch cannot silently reach the tutorial site.
  toolbox-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Check out ADCToolbox
        uses: actions/checkout@v7
        with:
          repository: Arcadia-1/ADCToolbox
          path: toolbox

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: toolbox/python/pyproject.toml

      - run: pip install -e ./toolbox/python

      - name: Compare the verification scripts with what they printed before
        run: python .github/toolbox-drift.py
